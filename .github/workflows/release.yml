name: Build and Release Android APK

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (Regenerate Native Android Folder)
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace -x lintVitalRelease

      - name: Verify JS Bundle in APK
        run: |
          echo "Verifying index.android.bundle is packaged in the Release APK..."
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/index.android.bundle" || (echo "JS BUNDLE MISSING!" && exit 1)
          echo "JS BUNDLE FOUND!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NDeskBrowser-v1.0.2-RC1.apk
          path: |
            android/app/build/outputs/apk/release/*.apk

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
